spring.application.name=iot-backend

spring.datasource.url=jdbc:mysql://localhost:3306/uavdb?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=changeme

# Đọc thêm file riêng trên máy bạn (nếu có), file này ghi đè mật khẩu
spring.config.import=optional:classpath:application-local.properties

# Không để Spring tự sửa bảng (bảng đã tạo bằng schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC